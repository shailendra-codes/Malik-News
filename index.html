<!DOCTYPE html>
<html lang="hi">
<head>
  <meta name="google-site-verification" content="mlt2TRzrW2iidT1efqG6k_A8lAYNFazR9OlapwOTcHo" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malik News - आम समस्याओं के आसान समाधान | साप्ताहिक न्यूज़लेटर</title>
  <meta name="description" content="Malik News एक साप्ताहिक हिंदी न्यूज़लेटर है जो रोज़मर्रा की आम समस्याओं और उनके आसान समाधान बताता है।">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #222;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9fafb;
    }
    header {
      text-align: center;
      padding: 30px 15px;
      background: #1e3a8a;
      color: #fff;
      border-radius: 10px;
    }
    header h1 { margin: 0; font-size: 2.2rem; }
    header p { margin: 8px 0 0; font-size: 1.05rem; opacity: 0.9; }
    .subscribe-box {
      background: #fff;
      padding: 25px;
      margin: 25px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      text-align: center;
    }
    .subscribe-btn {
      display: inline-block;
      padding: 14px 28px;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 10px;
    }
    article {
      background: #fff;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    article h2 { color: #1e3a8a; margin-top: 0; }
    .tag {
      display: inline-block;
      background: #e0e7ff;
      color: #1e3a8a;
      padding: 3px 10px;
      border-radius: 15px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1>📰 Malik News</h1>
    <p>आम लोगों की रोज़मर्रा की समस्याओं और उनके आसान समाधान का साप्ताहिक मंच</p>
  </header>

  <section class="subscribe-box">
    <h3>हर सोमवार नया अंक सीधे अपने ईमेल पर पाएं (बिल्कुल मुफ़्त)</h3>
    <a href="mailto:aapka-email@://gmail.com" class="subscribe-btn">✉️ मुफ़्त में जुड़ें (Subscribe)</a>
  </section>

  <!-- यहाँ सभी नई और पुरानी खबरें अपने आप लोड होंगी -->
  <main id="news-container">
    <p style="text-align:center;">खबरें लोड हो रही हैं...</p>
  </main>

  <footer>
    <p>© 2026 Malik News • संपादक एवं डेवलपर: शैलेन्द्र कुमार सिंह</p>
  </footer>

  <!-- स्मार्ट ऑटो-लोडर सिस्टम -->
  <script>
    // बस हर हफ्ते इस लिस्ट में नई फाइल का नाम सबसे ऊपर जोड़ दें
    const newsFiles = [
      'news-1.html'
    ];

    async function loadAllNews() {
      const container = document.getElementById('news-container');
      container.innerHTML = '';

      for (const file of newsFiles) {
        try {
          const response = await fetch(file);
          if (response.ok) {
            const html = await response.text();
            container.innerHTML += html;
          }
        } catch (e) {
          console.log('Error loading:', file);
        }
      }
    }
    loadAllNews();
  </script>

</body>
</html>
